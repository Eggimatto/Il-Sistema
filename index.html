];

 if(!state.lifePlan||typeof state.lifePlan!=='object'||Array.isArray(state.lifePlan))state.lifePlan={};

 const workStart=validClock(w.start)?w.start:'09:00', workEnd=validClock(w.end)?w.end:'18:00';

function importPrivateFile(json,state,persist,render,toast){
 if(!json||json.kind!=='il-sistema-private-profile-v1'||json.schema!==1)throw Error('File del piano non riconosciuto');
 const normalized=normalise(json.settings);const data=lp(state);data.settings=normalized;

 persist();render();toast('Profilo personale caricato: progressi e XP conservati.');

function medianBedtime(state,day){
 const vals=Object.entries(state.logs||{}).filter(([d,l])=>d<=day&&daysSince(d)<=14&&validClock(l?.bedtime)).map(([d,l])=>minTime(l.bedtime));
 if(vals.length<3)return null;
 vals.sort((a,b)=>a-b);return vals[Math.floor(vals.length/2)];
}
function sleepAdvice(state,day){

function fatigue(state,day){

 const prev=new Date(day+'T12:00:00');prev.setDate(prev.getDate()-1);

ss="muted small" style="margin:0">${weekDone} ricompense su ${plan.quests.length} riscattate</p></div><span class="rankbadge">${Math.round(weekDone/Math.max(1,plan.quests.length)*100)}% COMPLETATO</span></div></section><section class="panel"><div class="panelhead"><h2>Prove settimanali</h2><span class="caption">Aggiornamento automatico</span></div><div class="weeklyList">${plan.quests.map(q=>renderWeeklyQuest(q,start)).join('')}</div></section><section class="bossCard ${weeklyBossReady(start)?'ready':''}"><div class="eyebrow">BOSS SETTIMANALE</div><div class="bossSymbol">⚔</div><h2>Guardiano della costanza</h2><p>${Math.min(3,plan.quests.length)} prove settimanali riscattate per sbloccare il Boss.</p><div class="progress"><i style="width:${Math.min(100,Math.round(weekDone/Math.max(1,Math.min(3,plan.quests.length))*100))}%"></i></div><div class="row between wrap"><strong>${weekDone} / ${Math.min(3,plan.quests.length)} sigilli</strong>${getWeeklyClaim(start,'boss')?`<span class="pill complete">Boss sconfitto · +100 XP</span>`:weeklyBossReady(start)?`<button class="btn" data-claim-week="boss">Sconfiggi il Boss · +100 XP</button>`:`<span class="caption">Da sbloccare · +100 XP</span>`}</div></section><section class="panel"><div class="panelhead"><h2>Adattamento del Sistema</h2><span class="caption">Cambia solo ogni lunedì</span></div>${plan.quests.map(q=>`<div class="insight"><b>${escapeHtml(AREAS[q.area]?.name)}</b> · ${escapeHtml(TIERS[q.tier])}<div class="caption">${escapeHtml(plan.feedback[q.area]||'')}</div></div>`).join('')}<div class="footnote">Il Sistema valuta i completamenti della settimana precedente solo con almeno 3 giorni registrati. Se mancano dati, mantiene le difficoltà. Non usa peso, umore o qualità del sonno per alzarle.</div></section>`}<div class="tip">◈ Le quest quotidiane e settimanali danno XP separati. Le ricompense settimanali richiedono un riscatto e non possono essere riscattate due volte.</div></div>`}
function renderJournal(){const l=getLog(),max=dateKey(new Date());return `<div class="stack"><section class="panel"><div class="row between wrap"><div><div class="eyebrow">REGISTRO QUOTIDIANO</div><h2 style="font-size:20px;margin:4px 0 0">Traccia la tua giornata</h2></div><div class="field" style="min-width:145px"><label for="logDate">Data del diario</label><input type="date" id="logDate" value="${logDate}" max="${max}"/></div></div><div class="hdiv"></div><form id="logForm" class="stack"><div><div class="sectioncap">01 / Riposo</div><div class="formgrid"><div class="field fieldbox"><label for="sleepHours">Ore di sonno</label><input id="sleepHours" name="sleepHours" type="number" min="0" max="24" step="any" inputmode="decimal" placeholder="Es. 7.5" value="${l.sleepHours??''}"/></div><div class="field fieldbox"><label>Qualità del sonno</label>${scoreMarkup('sleepQuality',l.sleepQuality)}</div></div><div class="formgrid" style="margin-top:10px"><div class="field fieldbox"><label for="bedtime">Orario in cui ti sei coricato (facoltativo)</label><input id="bedtime" name="bedtime" type="time" value="${escapeHtml(l.bedtime||'')}"/><small>Es. 04:15; ci aiuta a proporre cambiamenti da 15 minuti.</small></div><div class="field fieldbox"><label for="napMinutes">Pisolino (minuti, facoltativo)</label><input id="napMinutes" name="napMinutes" type="number" min="0" max="240" step="5" inputmode="numeric" value="${l.napMinutes??''}"/></div></div></div><div><div class="sectioncap">02 / Benessere emotivo</div><div class="formgrid three"><div class="field fieldbox"><label>Umore</label>${scoreMarkup('mood',l.mood)}</div><div class="field fieldbox"><label>Energia</label>${scoreMarkup('energy',l.energy)}</div><div class="field fieldbox"><label>Stress</label>${scoreMarkup('stress',l.stress)}</div></div></div><div><div class="sectioncap">03 / Corpo e movimento</div><div class="formgrid three"><div class="field fieldbox"><label for="weight">Peso (kg) · facoltativo</label><input id="weight" na function scoreMarkup(name,value){const labels=MENTAL_SCORE_LABELS[name];return `<div class="scoreselect" title="1: ${labels[0]} · 5: ${labels[4]}">${[1,2,3,4,5].map(v=>`<input type="radio" name="${name}" id="${name}${v}" value="${v}" ${Number(value)===v?'checked':''}/><label title="${labels[v-1]}" for="${name}${v}">${v}</label>`).join('')}</div><small>1 = ${labels[0].toLowerCase()} · 5 = ${labels[4].toLowerCase()}</small>`}
function saveJournal(form){const fd=new FormData(form),keys=['sleepHours','sleepQuality','mood','energy','stress','weight','activityMinutes','steps','water','foodQuality','focusMinutes','napMinutes'];const log={};keys.forEach(k=>{const v=fd.get(k);if(v!==null&&v!==''){const n=Number(String(v).replace(',','.'));if(Number.isFinite(n))log[k]=n}});const bed=String(fd.get('bedtime')||'');if(/^([01]\d|2[0-3]):[0-5]\d$/.test(bed))log.bedtime=bed;log.notes=String(fd.get('notes')||'').trim().slice(0,4000);log.habits=fd.getAll('habit_unused');(state.profile.habits||[]).forEach((h,i)=>{if(fd.get('habit_'+i)!==null)log.habits.push(h)});state.logs[logDate]=log;state.completions[logDate]=state.completions[logDate]||{};state.completions[logDate].checkin=new Date().toISOString();persist();render();toast('Diario salvato · quest di registrazione aggiornata')}
function programQuestDates(g,questId){
 const since=goalCreatedDay(g),today=dateKey(new Date());
 return Object.entries(state.completions||{}).filter(([day,claims])=>day>=since&&day<=today&&!!claims?.[questId]).map(([day])=>day).sort();
}
function programQualifyingWeeks(g,questId,minimum){
 const counts={};
 for(const day of programQuestDates(g,questId)){const week=weekStart(day);counts[week]=(counts[week]||0)+1}
 return Object.values(counts).filter(n=>n>=minimum).length;
}
function programSleepLogs(g){const since=goalCreatedDay(g),today=dateKey(new Date());return Object.entries(state.logs||{}).filter(([d,l])=>d>=since&&d<=today&&l&&(num(l.sleepHours)!==null||num(l.sleepQuality)!==null)).length}
function goalMetric(g){const rows=logsLast(7),k=g.metric,t=num(g.target);
 if(k==='program_strength')return {val:programQualifyingWeeks(g,'sistema_forza_v1',2),unit:'settimane con 2 sedute'};
 if(k==='program_sleep')return {val:programQualifyingWeeks(g,'sonno_rituale',4),unit:'settimane con 4 rituali'};
 if(k==='program_nutrition')return {val:programQualifyingWeeks(g,'sistema_pasti_v1',4),unit:'settimane con 4 giorni regolari'};if(k==='sleep_avg')return {val:avg(rows,'sleepHours'),unit:'ore medie / 7 gg'};if(k==='steps_avg')return {val:avg(rows,'steps'),unit:'passi medi / 7 gg'};if(k==='water_avg')return {val:avg(rows,'water'),unit:'litri medi / 7 gg'};if(k==='activity_min')return {val:sum(rows,'activityMinutes'),unit:'min negli ultimi 7 gg'};if(k==='focus_min')return {val:sum(rows,'focusMinutes'),unit:'min negli ultimi 7 gg'};if(k==='checkins')return {val:rows.filter(x=>state.logs[x.day]!==undefined).length,unit:'giorni / 7 gg'};if(k==='quests_days')return {val:completionsPeriod(7).activeDays,unit:'giorni attivi / 7 gg'};if(k==='weight'){const ws=logsLast(365).map(x=>num(x.weight)).filter(x=>x!==null);return {val:ws.length?ws[ws.length-1]:null,unit:'kg · valore recente',start:num(g.startWeight)}};return {val:num(g.current)||0,unit:g.unit||'unità'}}
function goalProgress(g){const m=goalMetric(g),target=num(g.target);if(target===null||target===0||m.val===null)return 0;if(g.metric==='weight'){const base=m.start;if(base===null||base===target)return Math.abs(m.val-target)<.15?100:0;return Math.max(0,Math.min(100,(m.val-base)/(target-base)*100))}return Math.max(0,Math.min(100,m.val/target*100))}
const GOAL_METRICS={sleep_avg:'Media ore di sonno (7 giorni)',activity_min:'Minuti di movimento / settimana',steps_avg:'Passi medi (7 giorni)',water_avg:'Media litri d’acqua (7 giorni)',focus_min:'Minuti studio / lavoro / settimana',checkins:'Giorni di diario / settimana',quests_days:'Giorni con quest / settimana',weight:'Peso obiettivo (kg)',manual:'Progresso manuale (quantità)',program_strength:'Ciclo forza e recupero',program_sleep:'Ciclo del riposo',program_nutrition:'Ciclo alimentare'};
function goalCreatedDay(g){let d=String(g.createdAt||state.createdAt||'').slice(0,10);return /^\d{4}-\d{2}-\d{2}$/.test(d)?d:dateKey(new Date())}
function goalQuestDays(g){const since=goalCreatedDay(g),defs=allQuestDefs().filter(q=>q.area===g.area&&!q.special),ids=new Set(defs.map(q=>q.id));return Object.entries(state.completions).filter(([day,c])=>day>=since&&day<=dateKey(new Date())&&Object.keys(c||{}).some(k=>ids.has(k))).length}
function goalJournalDays(g){const since=goalCreatedDay(g);return Object.keys(state.logs).filter(d=>d>=since&&d<=dateKey(new Date())).length}
function goalWeeklyClears(g){const since=String(g.createdAt||state.createdAt||'');return Object.entries(state.weeklyClaims||{}).filter(([week])=>week>=weekStart(goalCreatedDay(g))).filter(([week,claims])=>{const claim=claims?.['weekly_'+g.area];return claim&&String(claim.at||'')>=since}).length}

function goalCard(g,compact=false){if(g.program){const stages=getDungeonStages(g),count=dungeonClearCount(g),active=stages.findIndex(s=>!dungeonClaimed(g,s.id)),idx=active<0?3:active,stage=stages[idx];return `<div class="goal clear-summary"><div class="row between wrap"><h3>${clearDungeonTitle(g)}</h3><span class="pill ${count===4?'complete':''}">${count}/4 tappe</span></div><p class="muted small">${escapeHtml(clearDungeonStageName(g,idx,stage))}</p><div class="progress"><i style="width:${Math.min(100,Math.round(stage.current/Math.max(1,stage.target)*100))}%"></i></div><p class="caption">${count===4?'Percorso completato':`${pretty(stage.current,0)} di ${stage.target} ${escapeHtml(stage.unit)}`}</p><button class="btn secondary full" data-dungeon="${escapeHtml(g.id)}">Apri e vedi cosa fare →</button></div>`}const m=goalMetric(g),pct=goalProgress(g),clears=dungeonClearCount(g);return `<div class="goal" style="margin-bottom:9px"><div class="row between wrap"><h3>${escapeHtml(g.name)}</h3><span class="pill ${clears===4?'complete':''}">${clears===4?'Dungeon completato':clears+'/4 capitoli'}</span></div><p>${escapeHtml(AREAS[g.area]?.name||'Obiettivo')} · ${escapeHtml(GOAL_METRICS[g.metric]||g.metric)}${g.deadline?' · Scad. '+formatDate(g.deadline):''}</p>${g.summary?`<p class="programNote">${escapeHtml(g.summary)}</p>`:''}<div class="progress"><i style="width:${pct}%"></i></div><div class="goalbottom"><span>${pretty(m.val)} ${escapeHtml(m.unit)} / target ${pretty(num(g.target))}</span><strong>${Math.round(pct)}%</strong></div><div class="goalactions"><button class="btn ${compact?'secondary':''} smallbtn" data-dungeon="${escapeHtml(g.id)}">⚔ Entra nel Dungeon</button>${!compact&&g.metric==='manual'?`<button class="btn secondary smallbtn" data-update-goal="${escapeHtml(g.id)}">Aggiorna progresso</button>`:''}${!compact?`<button class="linkbtn red" data-delete-goal="${escapeHtml(g.id)}">Elimina</button>`:''}</div></div>`}
function personalDungeonContext(g){
 if(g.program==='strength'){
  const mission=String(state.profile?.mission||'');
  const match=mission.match(/(?:prendere|aumentare|guadagnare|mettere)\s+(\d{1,2}(?:[.,]\d{1,2})?)\s*kg/i);
  if(match){const delta=Number(match[1].replace(',','.'));if(delta>0&&delta<=50)return `Hai indicato +${pretty(delta)} kg come obiettivo di lungo periodo. Questo primo ciclo costruisce abitudini di forza e recupero; il ritmo di aumento va valutato considerando altezza, età e condizioni di salute.`}
 }
 if(g.program==='sleep'){
  const vals=logsLast(30).map(l=>num(l.sleepHours)).filter(v=>v!==null);
  if(vals.length===1)return `Hai registrato ${pretty(vals[0])} ore di sonno in una giornata. È un punto di partenza, non una tendenza: punta prima alla regolarità e al recupero.`;
 }
 return '';
}
function renderDungeon(g){if(g.program)return renderClearDungeon(g);const stages=getDungeonStages(g),m=goalMetric(g),pct=goalProgress(g),rewarded=dungeonClearCount(g),foodSection=(g.program==='nutrition'||g.program==='strength')?(window.SistemaLifePlan?.renderFood?.(state,dateKey(new Date()))||window.SistemaFoodPlan?.render?.(state,dateKey(new Date()),weekStart())||''):'';return `<div class="stack"><button class="btn secondary backButton" data-back-dungeon="1">← Torna ai tuoi dungeon</button><section class="dungeonHero"><div class="eyebrow">${g.program?'PERCORSO GUIDATO · CICLO I':'DUNGEON PERSONALE'} · ${escapeHtml(AREAS[g.area]?.name||'Obiettivo')}</div><div class="dungeonGlyph">⚔</div><h2>${escapeHtml(g.name)}</h2><p>Progressione ${Math.round(pct)}% · ${pretty(m.val)} ${escapeHtml(m.unit)} / ${pretty(num(g.target))}</p>${g.note?`<div class="programNote">${escapeHtml(g.note)}</div>`:''}${personalDungeonContext(g)?`<div class="programNote">${escapeHtml(personalDungeonContext(g))}</div>`:''}<div class="progress"><i style="width:${pct}%"></i></div><div class="row between wrap" style="margin-top:15px"><span class="pill ${rewarded===4?'complete':''}">${rewarded} / 4 capitoli conquistati</span>${g.deadline?`<span class="caption">Data indicativa: ${formatDate(g.deadline)}</span>`:''}</div></section>${window.SistemaLifePlan?.renderDungeon?.(state,g)||''}${foodSection}<section class="panel"><div class="panelhead"><h2>Le quattro soglie</h2><span class="caption">Ricompense una sola volta</span></div><div class="dungeonSteps">${stages.map((stage,index)=>{const done=dungeonClaimed(g,stage.id),unlocked=index===0||dungeonClaimed(g,stages[index-1].id),ready=stage.current>=stage.target,percentage=Math.max(0,Math.min(100,stage.current/stage.target*100));return `<article class="dungeonStage ${done?'cleared':''} ${!unlocked?'locked':''}"><div class="stageTop"><span class="stageIcon">${stage.ico}</span><div class="grow"><div class="eyebrow">${done?'SIGILLO CONQUISTATO':unlocked?'SIGIL  plan.quests.forEach(q=>r.push(`- ${q.title} (${AREAS[q.area]?.name}, ${TIERS[q.tier]}): ${pretty(weeklyProgress(q,w),0)}/${q.target}; ${getWeeklyClaim(w,q.id)?'RICOMPENSA RISCATTATA':'in corso'}; decisione Sistema: ${plan.feedback[q.area]||'—'}`));r.push(`- Boss settimanale: ${getWeeklyClaim(w,'boss')?'sconfitto':weeklyBossReady(w)?'pronto':'in preparazione'}`,'','## Dungeon e traguardi');

 if(window.SistemaLifePlan?.enabled?.(state))r.push(...window.SistemaLifePlan.report(state,n));else if(window.SistemaFoodPlan?.enabled?.(state))r.push(...window.SistemaFoodPlan.report(state,n));
 r.push('', '## Registro giornaliero', '| Data | Sonno h | Umore | Stress | Energia | Peso kg | Attività min | Passi | Focus min | Quest completate |','|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|');s.rows.forEach(x=>{if(state.logs[x.day]||state.completions[x.day])r.push(`| ${x.day} | ${pretty(num(x.sleepHours))} | ${pretty(num(x.mood),0)} | ${pretty(num(x.stress),0)} | ${pretty(num(x.energy),0)} | ${pretty(num(x.weight))} | ${pretty(num(x.activityMinutes),0)} | ${pretty(num(x.steps),0)} | ${pretty(num(x.focusMinutes),0)} | ${Object.keys(state.completions[x.day]||{}).length} |`)});
 r.push('','## Richiesta a ChatGPT','Analizza questi dati senza fare diagnosi mediche. Mostrami tendenze, progressi sui dungeon, aderenza alle quest e proponi cambiamenti realistici per le prossime sette giornate. Non dedurre causalità da correlazioni; non trattare giorni senza registrazioni come fallimenti. Non usare peso o umore per dare punizioni.','', 'Nota: i dati mancanti non sono considerati uguali a zero. Le statistiche RPG sono simboliche.');return r.join('\n')}

function renderOnStep2(){return `<div class="eyebrow">03 / MISSIONE</div><h2>Cosa vuoi migliorare?</h2><p class="muted">Seleziona le aree che vuoi seguire. Il Sistema creerà una missione quotidiana per ciascuna area.</p><div class="focusgrid">${Object.entries(AREAS).map(([k,a])=>`<button type="button" class="focusCard ${onboardData.focus.includes(k)?'active':''}" data-focus="${k}"><div class="em">${a.ico}</div><div><b>${a.name}</b><span>${a.desc}</span></div></button>`).join('')}</div><div class="hdiv"></div><div class="formgrid"><div class="field"><label for="onTime">Tempo realistico al giorno</label><select id="onTime">${[[10,'10 minuti'],[20,'20 minuti'],[30,'30 minuti'],[45,'45 minuti'],[60,'1 ora']].map(([v,l])=>`<option value="${v}" ${Number(onboardData.dailyMinutes)===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label for="onIntensity">Difficoltà delle quest</label><select id="onIntensity"><option value="gentle" ${onboardData.intensity==='gentle'?'selected':''}>Graduale</option><option value="balanced" ${onboardData.intensity==='balanced'?'selected':''}>Bilanciata</option><option value="hard" ${onboardData.intensity==='hard'?'selected':''}>Impegnativa</option></select></div></div><p class="caption">Non servono obiettivi estremi. Potrai modificare difficoltà e quest dopo il risveglio.</p>`}
function collectOnStep(){if(onboardStep===0){onboardData.name=(document.getElementById('onName')?.value||'').trim().slice(0,50);onboardData.mission=(document.getElementById('onMission')?.value||'').trim().slice(0,500);if(!onboardData.name){toast('Inserisci un nome o nickname.');return false}}else if(onboardStep===1){onboardData.sleepHours=numberInput('onSleep',7,0,24);onboardData.sleepTarget=numberInput('onTarget',8,1,16);onboardData.sleepQuality=numberInput('onQuality',3,1,5);onboardData.mood=numberInput('onMood',3,1,5);onboardData.energy=numberInput('onEnergy',3,1,5);onboardData.stress=numberInput('onStress',3,1,5);onboardData.habitIdeas=(document.getElementById('onHabits')?.value||'').trim().slice(0,300);onboardData.activityDays=numberInput('onActivity',2,0,7);const w=document.getElementById('onWeight').value;onboardData.weight=w?numberInput('onWeight',null,1,500):''}else{onboardData.dailyMinutes=numberInput('onTime',20,10,60);onboardData.intensity=document.getElementById('onIntensity').value;if(!onboardData.focus.length){toast('Scegli almeno un’area da seguire.');return false}}return true}

function claimWeekly(id){const start=weekStart(),plan=ensureWeekPlan();state.weeklyClaims[start]=state.weeklyClaims[start]||{};if(getWeeklyClaim(start,id)){toast('Ricompensa già riscattata');return}if(id==='boss'){if(!weeklyBossReady(start)){toast('Conquista prima i sigilli settimanali');return}state.weeklyClaims[start].boss={at:new Date().toISOString(),xp:100};persist();render();toast('BOSS SCONFITTO · +100 XP!');return}const quest=plan.quests.find(q=>q.id===id);if(!quest||weeklyProgress(quest,start)<quest.target){toast('Prova non ancora completata');return}state.weeklyClaims[start][id]={at:new Date().toISOString(),xp:quest.xp};persist();render();toast('SIGILLO SETTIMANALE · +'+quest.xp+' XP!')}
function claimDungeonStage(goalId,stageId){const g=state.goals.find(g=>g.id===goalId);if(!g)return;const stages=getDungeonStages(g),idx=stages.findIndex(x=>x.id===stageId);if(idx<0)return;const stage=stages[idx];if(dungeonClaimed(g,stageId)){toast('Sigillo già conquistato');return}if((idx>0&&!dungeonClaimed(g,stages[idx-1].id))||stage.current<stage.target){toast('Il capitolo è ancora bloccato');return}state.dungeonClaims[g.id]=state.dungeonClaims[g.id]||{};state.dungeonClaims[g.id][stageId]={at:new Date().toISOString(),xp:stage.xp};persist();render();toast(stageId==='boss'?'BOSS SCONFITTO · Dungeon conquistato!':'SIGILLO CONQUISTATO · +'+stage.xp+' XP!')}

function saveProfile(e){e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('name')||'').trim();const focus=f.getAll('area').filter(k=>AREAS[k]);if(!name){toast('Inserisci un nome.');return}if(!focus.length){toast('Scegli almeno un’area.');return}state.profile.name=name.slice(0,50);state.profile.mission=String(f.get('mission')||'').trim().slice(0,500);state.profile.sleepTarget=Math.max(1,Math.min(16,num(f.get('sleepTarget'))||8));state.profile.focus=focus;state.profile.dailyMinutes=Number(f.get('dailyMinutes'))||20;state.profile.intensity=String(f.get('intensity')||'balanced');persist();render();toast('Profilo salvato')}

function openModal(type,id,options={}){if(type==='confirm'){const el=modalHtml(`<div class="eyebrow">CONFERMA AZIONE</div><h2>Sei sicuro?</h2><p class="muted">${escapeHtml(options.message)}</p><div class="modalBtns"><button class="btn secondary" data-close-modal="1">Annulla</button><button class="btn danger" id="confirmYes">Conferma</button></div>`);el.querySelector('#confirmYes').addEventListener('click',()=>{closeModal();options.fn()});return}
 if(type==='quickCheckin'){const day=dateKey(new Date()),l=getLog(day),select=(name,label)=>`<div class="field"><label>${label}</label><select name="${name}"><option value="">Non registrare</option>${[1,2,3,4,5].map(v=>`<option value="${v}" ${Number(l[name])===v?'selected':''}>${v} — ${MENTAL_SCORE_LABELS[name][v-1]}</option>`).join('')}</select></div>`;const el=modalHtml(`<div class="eyebrow">CHECK-IN RAPIDO · MOBILE</div><h2>Come stai oggi?</h2><p class="muted small">Bastano pochi secondi. Puoi completare il diario in un secondo momento.</p><form id="quickForm" class="stack"><div class="field"><label>Ore di sonno (facoltative)</label><input type="number" inputmode="decimal" min="0" max="24" step="0.25" name="sleepHours" value="${l.sleepHours??''}" placeholder="Es. 7.5"/></div><div class="formgrid">${select('mood','Umore')}${select('energy','Energia')}${select('stress','Stress')}</div><div class="modalBtns"><button type="button" class="btn secondary" data-close-modal="1">Annulla</button><button type="submit" class="btn">Salva check-in</button></div></form>`);el.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),values={},limits={sleepHours:[0,24],mood:[1,5],energy:[1,5],stress:[1,5]};for(const k of Object.keys(limits)){const value=num(f.get(k));if(value!==null&&value>=limits[k][0]&&value<=limits[k][1])values[k]=value}if(!Object.keys(values).length){toast('Registra almeno un valore');return}const first=!state.completions[day]?.checkin;state.logs[day]={...state.logs[day],...values};state.completions[day]=state.completions[day]||{};state.completions[day].checkin=state.completions[day].checkin||new Date().toISOString();persist();closeModal();render();toast(first?'Check-in salvato · +15 XP':'Check-in aggiornato')});return}

function downloadFile(name,contents,mime='text/plain;charset=utf-8'){const blob=new Blob([contents],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}

async function copyText(s){try{await navigator.clipboard.writeText(s);toast('Riepilogo copiato')}catch(e){downloadFile('Sistema_Report.md',s,'text/markdown');toast('Impossibile copiare: report salvato come file')}}
function validImport(d){return d&&[1,2,3].includes(Number(d.version))&&d.profile&&typeof d.profile.name==='string'&&Array.isArray(d.profile.focus)&&typeof d.logs==='object'&&d.logs!==null&&!Array.isArray(d.logs)&&typeof d.completions==='object'&&d.completions!==null&&!Array.isArray(d.completions)&&Array.isArray(d.goals)&&Array.isArray(d.customQuests)&&Object.keys(d.logs).length<20000&&Object.keys(d.completions).length<20000&&(!d.weeklyPlans||Object.keys(d.weeklyPlans).length<3000)&&(!d.weeklyClaims||Object.keys(d.weeklyClaims).length<3000)}
async function importData(e){const file=e.target.files?.[0];if(!file)return;if(file.size>10*1024*1024){toast('Il file supera 10 MB.');return}try{const json=JSON.parse(await file.text()),d=json?.data||json;if(!validImport(d))throw Error('Backup non riconosciuto');confirmAction('Importare questo backup? Sovrascriverà TUTTI i dati attuali. Esporta prima una copia di sicurezza.',()=>{state=migrateState(d);state.profile.habits=Array.isArray(state.profile.habits)?state.profile.habits:[];state.profile.focus=state.profile.focus.filter(k=>Boolean(AREAS[k]));state.customQuests=state.customQuests.filter(q=>q&&typeof q.id==='string'&&typeof q.title==='string');state.goals=state.goals.filter(g=>g&&typeof g.id==='string'&&typeof g.name==='string');persist();view='dashboard';activeDungeonId=null;render();toast('Backup importato correttamente')})}catch(err){toast('Errore: file JSON non valido.')}finally{e.target.value=''}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.sistemaInstallPrompt=e});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
render();
window.cloudSync?.connect?.();
</script>
</body>
